<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frame + PDF</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        display: grid;
        grid-template-rows: auto 1fr auto;
        height: 100vh;
      }

      header {
        display: flex;
        gap: 8px;
        padding: 10px;
        border-bottom: 1px solid #ddd;
      }

      input {
        flex: 1;
        padding: 8px;
      }

      button {
        padding: 8px 12px;
        cursor: pointer;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: 0;
      }

      footer {
        padding: 8px 10px;
        border-top: 1px solid #ddd;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <header>
      <input id="urlInput" type="url" placeholder="https://exemplo.com" />
      <button id="openBtn">Abrir URL</button>
      <button id="pdfBtn">Salvar como PDF</button>
    </header>

    <iframe id="siteFrame" title="Conteúdo"></iframe>

    <footer id="status">Pronto.</footer>

    <script>
      const urlInput = document.getElementById('urlInput');
      const openBtn = document.getElementById('openBtn');
      const pdfBtn = document.getElementById('pdfBtn');
      const siteFrame = document.getElementById('siteFrame');
      const status = document.getElementById('status');

      function normalizeUrl(value) {
        if (!value) return '';
        if (value.startsWith('http://') || value.startsWith('https://')) {
          return value;
        }
        return `https://${value}`;
      }

      openBtn.addEventListener('click', () => {
        const url = normalizeUrl(urlInput.value.trim());
        if (!url) {
          status.textContent = 'Digite uma URL válida.';
          return;
        }
        siteFrame.src = url;
        status.textContent = `URL aberta no frame: ${url}`;
      });

      pdfBtn.addEventListener('click', async () => {
        const url = normalizeUrl(urlInput.value.trim());
        if (!url) {
          status.textContent = 'Digite uma URL válida antes de salvar.';
          return;
        }

        status.textContent = 'Gerando PDF...';
        const result = await window.appApi.savePageAsPdf(url);
        status.textContent = result.message;
      });
    </script>
  </body>
</html>
